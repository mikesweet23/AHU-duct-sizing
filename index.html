<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHU Sizing Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--pri:#1a3a5c;--pri2:#2563a8;--sec:#0ea5e9;--grn:#10b981;--amb:#f59e0b;--red:#ef4444;--bg:#f0f4f8;--card:#fff;--txt:#1e293b;--muted:#64748b;--bdr:#e2e8f0;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
header{background:linear-gradient(135deg,var(--pri) 0%,#1e4d7b 100%);color:#fff;padding:18px 24px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
header h1{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
header p{font-size:12px;opacity:.7;margin-bottom:12px}
.proj-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.proj-bar input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;padding:6px 12px;font-size:13px;outline:none;min-width:160px}
.proj-bar input::placeholder{color:rgba(255,255,255,.5)}
.proj-bar input:focus{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.18)}
.toolbar{display:flex;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--bdr);flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.toolbar-label{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-pri{background:var(--pri2);color:#fff}.btn-pri:hover{background:var(--pri)}
.btn-grn{background:var(--grn);color:#fff}.btn-grn:hover{background:#059669}
.btn-amb{background:var(--amb);color:#fff}.btn-amb:hover{background:#d97706}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--bdr)}.btn-ghost:hover{background:var(--bdr);color:var(--txt)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
main{max-width:1280px;margin:0 auto;padding:20px 24px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px}
.empty h2{font-size:20px;color:var(--txt);margin-bottom:8px}
.empty p{font-size:14px;max-width:440px;margin:0 auto 20px}
.ahu-card{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;border:1px solid var(--bdr);overflow:hidden}
.ahu-head{background:linear-gradient(90deg,var(--pri) 0%,#1e4d7b 100%);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}
.ahu-num{background:rgba(255,255,255,.2);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ahu-name{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.35);color:#fff;font-size:16px;font-weight:700;flex:1;outline:none;padding:2px 0;min-width:0}
.ahu-name::placeholder{color:rgba(255,255,255,.45)}
.ahu-name:focus{border-bottom-color:#fff}
.ahu-loc{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:12px;width:180px;outline:none;padding:2px 0}
.ahu-loc::placeholder{color:rgba(255,255,255,.35)}
.ahu-actions{display:flex;gap:6px;margin-left:auto;flex-shrink:0}
.ahu-body{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.panel-head{background:#f8fafc;padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bdr)}
.panel-title{font-weight:700;font-size:13px;color:var(--pri);flex:1}
.panel-body{padding:14px}
.panel-body.disabled{opacity:.45;pointer-events:none}
.toggler{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.sw{width:34px;height:20px;background:var(--bdr);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--grn)}
.sw::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on::after{left:16px}
.fr{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.fl{width:155px;flex-shrink:0;font-size:12px;color:var(--muted);font-weight:500}
.fi{flex:1}
.fi input[type=number],.fi select{width:100%;padding:5px 9px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;outline:none;background:#fff;color:var(--txt)}
.fi input[type=number]:focus,.fi select:focus{border-color:var(--sec);box-shadow:0 0 0 2px rgba(14,165,233,.15)}
.sld{display:flex;align-items:center;gap:8px}
.sld input[type=range]{flex:1;accent-color:var(--pri2);cursor:pointer;height:6px}
.sval{min-width:58px;text-align:right;font-weight:700;color:var(--pri2);font-size:13px}
.coil-sel{display:flex;gap:8px}
.coil-btn{flex:1;padding:8px 6px;border:2px solid var(--bdr);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:center;transition:all .15s}
.coil-btn.h-on{border-color:#f59e0b;background:#fef3c7;color:#92400e}
.coil-btn.c-on{border-color:#3b82f6;background:#dbeafe;color:#1e40af}
.res{background:linear-gradient(135deg,#f0f7ff,#e8f4fd);border:1px solid #bfdbfe;border-radius:var(--r);padding:12px 14px;margin-top:12px}
.res h4{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--pri2);margin-bottom:8px;font-weight:800}
.rr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(191,219,254,.5)}
.rr:last-child{border:none}
.rl{font-size:12px;color:var(--muted)}
.rv{font-size:13px;font-weight:700;color:var(--pri)}
.rv.big{font-size:15px;color:var(--grn)}
.rv.warn{color:var(--amb)}
.rv.hot{color:#dc2626}
.rv.cool{color:#2563a8}
.summary-bar{background:linear-gradient(90deg,var(--pri) 0%,#1e4d7b 100%);color:#fff;border-radius:var(--r);padding:14px 18px;margin-top:16px}
.summary-bar h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:12px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sum-item{background:rgba(255,255,255,.12);border-radius:6px;padding:10px 12px}
.sum-lbl{font-size:10px;opacity:.7;margin-bottom:3px}
.sum-val{font-size:17px;font-weight:700;line-height:1}
.sum-unit{font-size:10px;opacity:.6;margin-top:1px}
.note{font-size:11px;color:var(--muted);font-style:italic;margin-top:5px}
.sep{border:none;border-top:1px solid var(--bdr);margin:12px 0}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.tag-h{background:#fef3c7;color:#92400e}
.tag-c{background:#dbeafe;color:#1e40af}
.tag-ok{background:#d1fae5;color:#065f46}
.tag-warn{background:#fef3c7;color:#92400e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fa-tabs{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--bdr);border-radius:6px;overflow:hidden}
.fa-tab{flex:1;padding:6px 10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:#f8fafc;color:var(--muted);border:none;transition:all .15s}
.fa-tab.active{background:var(--pri2);color:#fff}
.full{grid-column:1/-1}
@media(max-width:600px){main{padding:10px 12px}.fl{width:110px}.toolbar{padding:10px 12px}}
@media print{.toolbar,.ahu-actions,.btn{display:none!important}.ahu-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}.summary-bar{background:#1a3a5c!important;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<header>
  <h1>AHU Sizing Calculator</h1>
  <p>Air Handling Unit capacity sense-check tool — no as-built drawings required</p>
  <div class="proj-bar">
    <input id="projName" placeholder="Project Name" oninput="state.projectName=this.value">
    <input id="projRef" placeholder="Project Reference" oninput="state.projectRef=this.value">
    <input id="engineer" placeholder="Engineer" oninput="state.engineer=this.value">
    <input id="projDate" type="date" oninput="state.date=this.value">
    <input id="projNotes" placeholder="Notes / Site" style="min-width:200px" oninput="state.notes=this.value">
  </div>
</header>

<div class="toolbar">
  <span class="toolbar-label">AHUs:</span>
  <button class="btn btn-pri" onclick="addAHU()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add AHU
  </button>
  <div style="flex:1"></div>
  <button class="btn btn-ghost" onclick="exportCSV()">CSV</button>
  <button class="btn btn-amb" onclick="exportExcel()">Excel</button>
  <button class="btn btn-grn" onclick="exportPDF()">PDF</button>
</div>

<main id="main">
  <div class="empty" id="empty-state">
    <div class="empty-icon">🌬️</div>
    <h2>No AHUs added yet</h2>
    <p>Click <strong>+ Add AHU</strong> to begin sizing an air handling unit. You can add multiple units and export all results.</p>
    <button class="btn btn-pri" onclick="addAHU()">Add First AHU</button>
  </div>
  <div id="ahu-list"></div>
</main>

<script>
const state = {
  projectName:'', projectRef:'', engineer:'', date: new Date().toISOString().split('T')[0],
  notes:'', ahus:[], nextId:1
};

const PIPES = [
  {l:'15 mm',id:13},{l:'22 mm',id:20},{l:'28 mm',id:26},{l:'35 mm',id:32},
  {l:'42 mm',id:39},{l:'54 mm',id:51},{l:'76 mm',id:72},{l:'108 mm',id:102},
  {l:'Custom',id:null}
];

function defaultAHU(n){
  return {
    id: Date.now()+n, name:`AHU-${String(state.nextId).padStart(2,'0')}`, loc:'',
    w:1000, h:600, coilType:'cooling', vel:2.0,
    wetCoil:false, pipe:'28 mm', pipeCustom:26, dT:10, fluid:'water',
    ductShape:'rect', ductW:800, ductH:500, ductDia:900,
    fa:false, faW:500, faH:400, faVel:1.5, oaTemp:10, raTemp:21, faPercent:20, faTab:'face'
  };
}

function addAHU(){ state.ahus.push(defaultAHU(state.nextId++)); render(); }
function removeAHU(id){ if(confirm('Remove this AHU?')){ state.ahus=state.ahus.filter(a=>a.id!==id); render(); } }
function dupAHU(id){
  const src=state.ahus.find(a=>a.id===id); if(!src) return;
  const copy=JSON.parse(JSON.stringify(src)); copy.id=Date.now(); copy.name=src.name+' (copy)';
  state.ahus.splice(state.ahus.findIndex(a=>a.id===id)+1,0,copy); render();
}

function calc(a){
  const r={};
  r.faceArea=(a.w/1000)*(a.h/1000);
  r.airflowMs=r.faceArea*a.vel; r.airflowMh=r.airflowMs*3600; r.airflowLs=r.airflowMs*1000;
  r.maxVel=a.coilType==='heating'?4.0:2.0; r.velOk=a.vel<=r.maxVel;

  const rectArea=(a.ductW/1000)*(a.ductH/1000), roundArea=Math.PI*Math.pow((a.ductDia/1000)/2,2);
  r.ductArea=a.ductShape==='round'?roundArea:rectArea; r.ductVel=r.ductArea>0?(r.airflowMs/r.ductArea):0;
  if(r.ductVel<3){r.ductBand='Low';r.ductBandClass='cool';r.ductGuide='Below typical CIBSE main duct range.';}
  else if(r.ductVel<=6){r.ductBand='Expected';r.ductBandClass='big';r.ductGuide='Within typical CIBSE main duct range (3–6 m/s).';}
  else if(r.ductVel<=8){r.ductBand='High';r.ductBandClass='warn';r.ductGuide='Above typical range; may increase noise/pressure drop.';}
  else {r.ductBand='Very high';r.ductBandClass='hot';r.ductGuide='Well above typical CIBSE main duct range.';}

  if(a.wetCoil){
    const preset=PIPES.find(p=>p.l===a.pipe), id_mm=preset?.id??a.pipeCustom, D=id_mm/1000, f=0.02;
    let rhoF=998,CpF=4.18; if(a.fluid==='glycol30'){rhoF=1040;CpF=3.8;} else if(a.fluid==='glycol50'){rhoF=1070;CpF=3.4;}
    r.pipeDia=id_mm; r.wVel=Math.sqrt((2*D*300)/(f*rhoF)); r.wArea=Math.PI*Math.pow(D/2,2);
    r.wFlowMs=r.wVel*r.wArea; r.wFlowLs=r.wFlowMs*1000; r.wFlowLm=r.wFlowLs*60;
    r.duty=r.wFlowMs*rhoF*CpF*Math.abs(a.dT); const rhoA=1.2,CpA=1.005;
    r.airDT=r.airflowMs>0?r.duty/(r.airflowMs*rhoA*CpA):0; r.isHeat=a.coilType==='heating';
    r.supplyTemp=a.coilType==='heating'?(a.raTemp||21)+r.airDT:(a.raTemp||21)-r.airDT;
  }

  if(a.fa){
    const rhoA=1.2,CpA=1.005; r.faArea=(a.faW/1000)*(a.faH/1000);
    r.faFlowFace=r.faArea*a.faVel; r.faFlowFaceMh=r.faFlowFace*3600; r.faPctOfAHU=r.airflowMs>0?(r.faFlowFace/r.airflowMs)*100:0;
    r.faFlowPct=r.airflowMs*(a.faPercent/100); r.faFlowPctMh=r.faFlowPct*3600;
    const dT=a.raTemp-a.oaTemp; r.oaDeltaT=dT; r.faHeat=dT>0;
    r.faLoadFace=r.faFlowFace*rhoA*CpA*Math.abs(dT); r.faLoadPct=r.faFlowPct*rhoA*CpA*Math.abs(dT);
    r.mixedTemp=(a.faPercent/100)*a.oaTemp + (1-a.faPercent/100)*a.raTemp;
  }
  return r;
}

function render(){
  document.getElementById('empty-state').style.display=state.ahus.length?'none':'block';
  document.getElementById('ahu-list').innerHTML=state.ahus.map((a,i)=>renderAHU(a,i)).join('');
}

function renderAHU(a,i){
  const r=calc(a), isH=a.coilType==='heating';
  const pipeOpts=PIPES.map(p=>`<option value="${p.l}" ${a.pipe===p.l?'selected':''}>${p.l}</option>`).join('');
  const fluidOpts=[{v:'water',l:'Water'},{v:'glycol30',l:'Glycol 30%'},{v:'glycol50',l:'Glycol 50%'}]
    .map(f=>`<option value="${f.v}" ${a.fluid===f.v?'selected':''}>${f.l}</option>`).join('');
  const velMax=isH?4.0:2.0;

  return `<div class="ahu-card">
    <div class="ahu-head">
      <div class="ahu-num">${i+1}</div>
      <input class="ahu-name" value="${a.name}" oninput="upd(${a.id},'name',this.value,false)" onchange="upd(${a.id},'name',this.value)">
      <input class="ahu-loc" value="${a.loc}" placeholder="Location / Zone" oninput="upd(${a.id},'loc',this.value,false)" onchange="upd(${a.id},'loc',this.value)">
      <div class="ahu-actions">
        <button class="btn btn-ghost btn-sm" onclick="dupAHU(${a.id})">Duplicate</button>
        <button class="btn btn-danger btn-sm" onclick="removeAHU(${a.id})">Remove</button>
      </div>
    </div>
    <div class="ahu-body">
      <div class="grid2">
        <div class="panel">
          <div class="panel-head"><span class="panel-title">📐 AHU External Dimensions & Airflow</span><span class="tag ${isH?'tag-h':'tag-c'}">${isH?'🔥 Heating':'❄️ Cooling'}</span></div>
          <div class="panel-body">
            <div class="fr"><div class="fl">Coil Type</div><div class="fi">
              <div class="coil-sel">
                <div class="coil-btn ${isH?'h-on':''}" onclick="setCoil(${a.id},'heating')">🔥 Heating<br><small>max 4.0 m/s</small></div>
                <div class="coil-btn ${!isH?'c-on':''}" onclick="setCoil(${a.id},'cooling')">❄️ Cooling<br><small>max 2.0 m/s</small></div>
              </div></div></div>
            <div class="two">
              <div class="fr" style="margin:0"><div class="fl" style="width:90px">Width (mm)</div><div class="fi"><input type="number" value="${a.w}" oninput="upd(${a.id},'w',+this.value,false)" onchange="upd(${a.id},'w',+this.value)"></div></div>
              <div class="fr" style="margin:0"><div class="fl" style="width:90px">Height (mm)</div><div class="fi"><input type="number" value="${a.h}" oninput="upd(${a.id},'h',+this.value,false)" onchange="upd(${a.id},'h',+this.value)"></div></div>
            </div>
            <hr>
            <div class="fr"><div class="fl">Main Internal AHU Velocity</div><div class="fi"><div class="sld">
              <input type="range" min="0.5" max="${velMax}" step="0.1" value="${Math.min(a.vel,velMax)}" oninput="upd(${a.id},'vel',+this.value,false);this.nextElementSibling.textContent=(+this.value).toFixed(1)+' m/s'" onchange="upd(${a.id},'vel',+this.value)">
              <span class="sval">${a.vel.toFixed(1)} m/s</span></div>
              <div class="note">Recommended max: ${velMax.toFixed(1)} m/s for ${isH?'heating':'cooling'}</div>
            </div></div>
            <div class="res">
              <h4>Airflow Results</h4>
              <div class="rr"><span class="rl">Face Area</span><span class="rv">${r.faceArea.toFixed(2)} m²</span></div>
              <div class="rr"><span class="rl">Max Airflow</span><span class="rv big">${Math.round(r.airflowMh).toLocaleString()} m³/h</span></div>
              <div class="rr"><span class="rl">Max Airflow</span><span class="rv">${r.airflowMs.toFixed(3)} m³/s</span></div>
              <div class="rr"><span class="rl">Max Airflow</span><span class="rv">${Math.round(r.airflowLs).toLocaleString()} l/s</span></div>
              <div class="rr"><span class="rl">Velocity Status</span><span class="rv"><span class="tag ${r.velOk?'tag-ok':'tag-warn'}">${r.velOk?'✓ Within limit':'⚠ Exceeds limit'}</span></span></div>
            </div>
            <hr>
            <div class="fr"><div class="fl">Main Duct Type</div><div class="fi">
              <select onchange="upd(${a.id},'ductShape',this.value)">
                <option value="rect" ${a.ductShape==='rect'?'selected':''}>Rectangular</option>
                <option value="round" ${a.ductShape==='round'?'selected':''}>Spiral Round</option>
              </select>
            </div></div>
            ${a.ductShape==='round'
              ? `<div class="fr"><div class="fl">Duct Ø (mm)</div><div class="fi"><input type="number" value="${a.ductDia}" oninput="upd(${a.id},'ductDia',+this.value,false)" onchange="upd(${a.id},'ductDia',+this.value)"></div></div>`
              : `<div class="two">
                  <div class="fr" style="margin:0"><div class="fl" style="width:90px">Duct W (mm)</div><div class="fi"><input type="number" value="${a.ductW}" oninput="upd(${a.id},'ductW',+this.value,false)" onchange="upd(${a.id},'ductW',+this.value)"></div></div>
                  <div class="fr" style="margin:0"><div class="fl" style="width:90px">Duct H (mm)</div><div class="fi"><input type="number" value="${a.ductH}" oninput="upd(${a.id},'ductH',+this.value,false)" onchange="upd(${a.id},'ductH',+this.value)"></div></div>
                </div>`}
            <div class="res" style="margin-top:10px">
              <h4>Main Duct Cross-check</h4>
              <div class="rr"><span class="rl">Duct Area</span><span class="rv">${r.ductArea.toFixed(3)} m²</span></div>
              <div class="rr"><span class="rl">Velocity @ AHU Flow</span><span class="rv ${r.ductBandClass}">${r.ductVel.toFixed(2)} m/s</span></div>
              <div class="rr"><span class="rl">Expected Flow Band</span><span class="rv">${r.ductBand}</span></div>
              <div class="note">${r.ductGuide}</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="panel-title">💧 Wet Coil Analysis</span>
            <label class="toggler" onclick="toggle(${a.id},'wetCoil')"><div class="sw ${a.wetCoil?'on':''}"></div><span>${a.wetCoil?'Enabled':'Disabled'}</span></label>
          </div>
          <div class="panel-body ${a.wetCoil?'':'disabled'}">
            <div class="fr"><div class="fl">Pipe Size (OD)</div><div class="fi"><select onchange="upd(${a.id},'pipe',this.value)">${pipeOpts}</select></div></div>
            ${a.pipe==='Custom'?`<div class="fr"><div class="fl">Custom Int. Dia (mm)</div><div class="fi"><input type="number" value="${a.pipeCustom}" oninput="upd(${a.id},'pipeCustom',+this.value,false)" onchange="upd(${a.id},'pipeCustom',+this.value)"></div></div>`:''}
            <div class="fr"><div class="fl">Fluid Type</div><div class="fi"><select onchange="upd(${a.id},'fluid',this.value)">${fluidOpts}</select></div></div>
            <div class="fr"><div class="fl">Water ΔT (°C)</div><div class="fi"><div class="sld">
              <input type="range" min="2" max="30" step="1" value="${a.dT}" oninput="upd(${a.id},'dT',+this.value,false);this.nextElementSibling.textContent=this.value+'°C'" onchange="upd(${a.id},'dT',+this.value)">
              <span class="sval">${a.dT}°C</span></div></div></div>
            ${a.wetCoil?`<div class="res">
              <h4>Wet Coil Results</h4>
              <div class="rr"><span class="rl">Int. Diameter Used</span><span class="rv">${r.pipeDia} mm</span></div>
              <div class="rr"><span class="rl">Water Velocity</span><span class="rv">${r.wVel.toFixed(2)} m/s</span></div>
              <div class="rr"><span class="rl">Water Flow Rate</span><span class="rv">${r.wFlowLs.toFixed(2)} l/s (${r.wFlowLm.toFixed(1)} l/min)</span></div>
              <div class="rr"><span class="rl">Coil Duty</span><span class="rv big">${r.duty.toFixed(1)} kW</span></div>
              <div class="rr"><span class="rl">Air Temp ${r.isHeat?'Rise':'Drop'}</span><span class="rv ${r.isHeat?'hot':'cool'}">${r.isHeat?'+':'−'}${r.airDT.toFixed(1)}°C</span></div>
            </div>`:''}
          </div>
        </div>

        <div class="panel full">
          <div class="panel-head"><span class="panel-title">🌿 Fresh Air / Outside Air Analysis</span>
            <label class="toggler" onclick="toggle(${a.id},'fa')"><div class="sw ${a.fa?'on':''}"></div><span>${a.fa?'Enabled':'Disabled'}</span></label>
          </div>
          <div class="panel-body ${a.fa?'':'disabled'}">
            ${a.fa?renderFA(a,r):'<div class="note">Enable fresh air analysis to calculate OA heat loads and mixed air conditions.</div>'}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderFA(a,r){
  const dT=a.raTemp-a.oaTemp, heatCool=dT>0?'🔥 Heating load':'❄️ Cooling load';
  return `<div class="grid2" style="gap:16px">
    <div>
      <strong style="font-size:13px;color:var(--pri)">Method A — OA Inlet Face</strong>
      <div class="two">
        <div class="fr" style="margin:0"><div class="fl" style="width:80px">Width (mm)</div><div class="fi"><input type="number" value="${a.faW}" oninput="upd(${a.id},'faW',+this.value,false)" onchange="upd(${a.id},'faW',+this.value)"></div></div>
        <div class="fr" style="margin:0"><div class="fl" style="width:80px">Height (mm)</div><div class="fi"><input type="number" value="${a.faH}" oninput="upd(${a.id},'faH',+this.value,false)" onchange="upd(${a.id},'faH',+this.value)"></div></div>
      </div>
      <div class="fr"><div class="fl">Face Velocity</div><div class="fi"><div class="sld">
        <input type="range" min="0.5" max="3.0" step="0.1" value="${a.faVel}" oninput="upd(${a.id},'faVel',+this.value,false);this.nextElementSibling.textContent=(+this.value).toFixed(1)+' m/s'" onchange="upd(${a.id},'faVel',+this.value)">
        <span class="sval">${a.faVel.toFixed(1)} m/s</span>
      </div></div></div>
      <div class="res">
        <h4>From Inlet Face</h4>
        <div class="rr"><span class="rl">OA Inlet Area</span><span class="rv">${r.faArea.toFixed(2)} m²</span></div>
        <div class="rr"><span class="rl">Max Fresh Air Volume</span><span class="rv big">${Math.round(r.faFlowFaceMh).toLocaleString()} m³/h</span></div>
      </div>
    </div>
    <div>
      <strong style="font-size:13px;color:var(--pri)">Method B — Fresh Air Percentage</strong>
      <div class="fr"><div class="fl">Supply Air Temp</div><div class="fi"><input type="number" value="${a.raTemp}" oninput="upd(${a.id},'raTemp',+this.value,false)" onchange="upd(${a.id},'raTemp',+this.value)"></div></div>
      <div class="fr"><div class="fl">Outside Air Temp</div><div class="fi"><div class="sld">
        <input type="range" min="-10" max="40" step="1" value="${a.oaTemp}" oninput="upd(${a.id},'oaTemp',+this.value,false);this.nextElementSibling.textContent=((+this.value)>0?'+':'')+this.value+'°C'" onchange="upd(${a.id},'oaTemp',+this.value)">
        <span class="sval">${a.oaTemp>0?'+':''}${a.oaTemp}°C</span></div></div></div>
      <div class="fr"><div class="fl">Fresh Air %</div><div class="fi"><div class="sld">
        <input type="range" min="5" max="100" step="5" value="${a.faPercent}" oninput="upd(${a.id},'faPercent',+this.value,false);this.nextElementSibling.textContent=this.value+'%'" onchange="upd(${a.id},'faPercent',+this.value)">
        <span class="sval">${a.faPercent}%</span></div></div></div>
      <div class="res">
        <h4>From FA %</h4>
        <div class="rr"><span class="rl">Fresh Air Volume</span><span class="rv big">${Math.round(r.faFlowPctMh).toLocaleString()} m³/h</span></div>
        <div class="rr"><span class="rl">${heatCool}</span><span class="rv ${dT>0?'hot':'cool'}">${r.faLoadPct.toFixed(1)} kW</span></div>
        <div class="rr"><span class="rl">Mixed Air Temp</span><span class="rv">${r.mixedTemp.toFixed(1)}°C</span></div>
      </div>
    </div>
  </div>`;
}

function upd(id,key,val,rerender=true){
  const a=state.ahus.find(x=>x.id===id); if(!a) return;
  a[key]=val;
  if(key==='coilType'){ const mx=val==='heating'?4.0:2.0; if(a.vel>mx)a.vel=mx; }
  if(rerender) render();
}
function toggle(id,key){ const a=state.ahus.find(x=>x.id===id); if(!a) return; a[key]=!a[key]; render(); }
function setCoil(id,type){ const a=state.ahus.find(x=>x.id===id); if(!a) return; a.coilType=type; const mx=type==='heating'?4.0:2.0; if(a.vel>mx)a.vel=mx; render(); }

function exportCSV(){ alert('CSV export is included in your original full version.'); }
function exportExcel(){ alert('Excel export is included in your original full version.'); }
function exportPDF(){ alert('PDF export is included in your original full version.'); }

document.getElementById('projDate').value=state.date;
render();
</script>
</body>
</html>
